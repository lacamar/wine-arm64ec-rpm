# MangoHud layout for wine-arm64ec tests on Asahi: MANGOHUD_CONFIGFILE=~/.config/MangoHud/asahi-test.conf
legacy_layout=0
position=top-left
offset_x=60
offset_y=60
width=760
round_corners=32
cellpadding_y=0.12
background_color=0B0E14
background_alpha=0.85
alpha=1.0
font_file=/usr/share/fonts/rsms-inter-fonts/InterDisplay-SemiBold.ttf
font_file_text=/usr/share/fonts/rsms-inter-fonts/Inter-Medium.ttf
font_size=56
font_size_text=40
text_color=E8ECF2
engine_color=E8ECF2
cpu_color=E8ECF2
ram_color=E8ECF2
wine_color=E8ECF2
frametime_color=7FD1B9
fps_color_change
fps_color=F07178,FFB454,A6E3A1
fps_value=30,55

fps
frametime
frame_timing
fps_metrics=avg,0.01
resolution
present_mode
winesync
cpu_stats
custom_text=Memory
exec=asahi-hud mem
custom_text=GPU memory
exec=asahi-hud gpumem

custom_text=DXVK
exec=asahi-hud dxvk
custom_text=Mesa
exec=asahi-hud mesa
custom_text=Wine
exec=asahi-hud wine
custom_text=FEX
exec=asahi-hud fex
custom_text=Kernel
exec=asahi-hud kernel
custom_text=Machine
exec=asahi-hud machine
custom_text=SoC power
exec=asahi-hud power
toggle_hud=Shift_R+F12
