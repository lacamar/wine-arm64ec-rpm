# MangoHud layout for wine-arm64ec tests on Asahi: MANGOHUD_CONFIGFILE=~/.config/MangoHud/asahi-test.conf
# align_right, resolution_color and {RRGGBB} markup need the wine-arm64ec mangohud build
legacy_layout=0
table_columns=3
align_right
position=top-left
offset_x=72
offset_y=72
width=960
round_corners=40
cellpadding_y=0.1
background_color=0A0D12
background_alpha=0.88
alpha=1.0
font_file=/usr/share/fonts/rsms-inter-fonts/InterDisplay-SemiBold.ttf
font_size=64
no_small_font
text_color=EEF1F5
engine_color=FAB387
resolution_color=EEF1F5
fps_color_change
fps_color=F38BA8,F9E2AF,A6E3A1
fps_value=30,55
toggle_hud=Shift_R+F12

fps
frametime
dx_api
resolution
custom_text={89B4FA}CPU
exec=echo
exec=asahi-hud cpu
custom_text={F9E2AF}Power
exec=echo
exec=asahi-hud power
custom_text={CBA6F7}Memory
exec=echo
exec=asahi-hud memory
custom_text={EBA0AC}Wine
exec=echo
exec=asahi-hud wine
custom_text={94E2D5}FEX
exec=echo
exec=asahi-hud fex
custom_text={89DCEB}Graphics
exec=echo
exec=asahi-hud graphics
custom_text={B4BEFE}Kernel
exec=echo
exec=asahi-hud kernel
custom_text={F5C2E7}Machine
exec=echo
exec=asahi-hud machine
