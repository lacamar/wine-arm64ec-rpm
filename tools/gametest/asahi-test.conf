# MangoHud layout for wine-arm64ec tests on Asahi: MANGOHUD_CONFIGFILE=~/.config/MangoHud/asahi-test.conf
legacy_layout=0
table_columns=2
position=top-left
offset_x=72
offset_y=72
width=1300
round_corners=40
cellpadding_y=0.1
background_color=0A0D12
background_alpha=0.88
alpha=1.0
font_file=/usr/share/fonts/rsms-inter-fonts/InterDisplay-SemiBold.ttf
font_file_text=/usr/share/fonts/rsms-inter-fonts/Inter-Medium.ttf
font_size=64
no_small_font
text_color=EEF1F5
engine_color=EEF1F5
cpu_color=EEF1F5
frametime_color=7FD1B9
fps_color_change
fps_color=F07178,FFB454,A6E3A1
fps_value=30,55

fps
frametime
frame_timing
fps_metrics=avg,0.01
cpu_stats
custom_text=RAM / VRAM
exec=asahi-hud memory
custom_text=SoC power
exec=asahi-hud power
resolution
custom_text=Wine
exec=asahi-hud wine
custom_text=FEX
exec=asahi-hud fex
custom_text=DXVK / Mesa
exec=asahi-hud graphics
custom_text=Kernel
exec=asahi-hud kernel
custom_text=Machine
exec=asahi-hud machine
toggle_hud=Shift_R+F12
