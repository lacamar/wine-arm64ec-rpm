# MangoHud layout for wine-arm64ec tests on Asahi: MANGOHUD_CONFIGFILE=~/.config/MangoHud/asahi-test.conf
legacy_layout=0
table_columns=3
position=top-left
offset_x=72
offset_y=72
width=1100
round_corners=40
cellpadding_y=0.1
background_color=0A0D12
background_alpha=0.88
alpha=1.0
font_file=/usr/share/fonts/rsms-inter-fonts/InterDisplay-SemiBold.ttf
font_size=64
no_small_font
text_color=EEF1F5
engine_color=FFB454
cpu_color=59C2FF
frametime_color=7FD1B9
fps_color_change
fps_color=F07178,FFB454,A6E3A1
fps_value=30,55

fps
frametime
dx_api
fps_metrics=0.01
cpu_stats
custom_text=Memory
exec=asahi-hud memory 1
exec=asahi-hud memory 2
custom_text=SoC power
exec=asahi-hud power
exec=echo
resolution
custom_text=Wine
exec=asahi-hud wine 1
exec=asahi-hud wine 2
custom_text=FEX
exec=asahi-hud fex 1
exec=asahi-hud fex 2
custom_text=DXVK · Mesa
exec=asahi-hud graphics 1
exec=asahi-hud graphics 2
custom_text=Kernel
exec=asahi-hud kernel 1
exec=asahi-hud kernel 2
custom_text=Machine
exec=asahi-hud machine 1
exec=asahi-hud machine 2
toggle_hud=Shift_R+F12
